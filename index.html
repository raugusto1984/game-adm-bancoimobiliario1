
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Império Empresarial</title>

  <meta name="description" content="Jogo de tabuleiro de empreendedorismo para 2 a 6 jogadores.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px;
      background: #141e30;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: clamp(20px, 4vw, 32px);
      margin: 12px 0;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      margin: 15px auto;
      border-radius: 12px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
</head>

<body>
  <main>
    <h1>🏦 IMPÉRIO EMPRESARIAL</h1>
    <p>Construa seu império. Compre empresas. Vença seus concorrentes!</p>

    <script src="sketch.js"></script>
  </main>
</body>
</html>
